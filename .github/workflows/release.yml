name: Release

# Builds the wheel + sdist for a version tag, attaches them to the GitHub release
# (created from the tag's CHANGELOG section if it doesn't exist yet), then publishes
# them to PyPI as `tradekit-cli` through trusted publishing.
#
# The distribution was renamed from `tradekit`, which on PyPI belongs to an unrelated
# project (#30). Tags from before the rename still build a `tradekit` distribution, so
# the PyPI job only runs when the build produced `tradekit_cli` files.
#
# One-time setup on pypi.org: a (pending) trusted publisher for project `tradekit-cli`,
# owner `davdunc`, repository `tradekit`, workflow `release.yml`, environment `pypi`.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build and attach, e.g. v0.5.0"
        required: true

permissions:
  contents: write  # create the release and upload assets

jobs:
  release:
    name: Build and attach to GitHub release
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    outputs:
      publishable: ${{ steps.dist.outputs.publishable }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.14

      - name: Verify tag matches package version
        run: |
          VERSION="v$(uv run --no-project python -c 'import tomllib,pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag $TAG does not match pyproject version $VERSION"
            exit 1
          fi

      - name: Build
        run: uv build

      - name: Create or update GitHub release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            # Release notes = this version's CHANGELOG section.
            awk -v h="## [${TAG#v}]" 'index($0, h) == 1 {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
            gh release create "$TAG" dist/* --verify-tag --title "tradekit ${TAG#v}" --notes-file notes.md
          fi

      - name: Check the distribution name
        id: dist
        run: |
          if ls dist/tradekit_cli-* >/dev/null 2>&1; then
            echo "publishable=true" >> "$GITHUB_OUTPUT"
          else
            echo "publishable=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Built distribution is not tradekit-cli (pre-#30 tag?); skipping PyPI."
          fi

      - name: Keep the build for the PyPI job
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    name: Publish to PyPI (tradekit-cli)
    needs: release
    if: needs.release.outputs.publishable == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/tradekit-cli/
    permissions:
      id-token: write  # trusted publishing; no API token is stored anywhere

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true  # re-running a release must not fail on files already uploaded
